[build]
  publish = "public"
  functions = "netlify/functions"

# esbuild junta cada función con lo que importa (el asistente usa public/costos.js, la misma cuenta que la pantalla).
[functions]
  node_bundler = "esbuild"

# El service worker y el manifiesto no se guardan en caché del navegador: así cada versión nueva se detecta enseguida.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Link del ticket que se le manda al cliente: /t/<código> abre la página del ticket.
[[redirects]]
  from = "/t/*"
  to = "/ticket.html"
  status = 200
